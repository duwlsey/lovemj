<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>invitation to mj's birthday party</title><meta name="description" content="민재님께 도착한 작은 생일 초대장."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%23ff91bb' d='M2 3h4v2h4V3h4v6h-2v2h-2v2H6v-2H4V9H2z'/%3E%3C/svg%3E"><style>
@import url('https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css');
:root{color-scheme:dark;--pink:#ff94bf;--dim:#777}*{box-sizing:border-box}body{margin:0;background:#080808;color:#f4f3ee;font-family:'Galmuri11','Courier New',monospace;min-height:100svh}body:after{content:'';position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,#ffffff02 3px 4px);z-index:9}button,input{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--pink);outline-offset:7px}header{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;gap:20px;padding:26px 34px;font:12px 'Courier New',monospace;color:#858585;letter-spacing:1px}header .brand{color:#c0c0c0}main{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:100px 26px}#intro{position:absolute;inset:0;width:100%;background:transparent;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px}#intro img{width:240px;height:200px;object-fit:contain;image-rendering:pixelated;animation:float 3s steps(18) infinite}#intro .hint{font-size:14px;letter-spacing:2px;color:#aaa;animation:blink 2s steps(2) infinite}#intro .to{color:var(--pink);font-size:14px;letter-spacing:2px}#conversation{width:min(700px,100%)}.command{font:12px 'Courier New',monospace;color:#777;margin-bottom:30px;letter-spacing:2px}.command span{color:var(--pink)}#text{font-size:clamp(20px,3vw,26px);line-height:1.95;white-space:pre-wrap;min-height:130px;word-break:keep-all}#text:after{content:' ';display:inline-block;background:var(--pink);width:12px;height:23px;margin-left:9px;vertical-align:middle;animation:blink 1s steps(2) infinite}#choices{display:flex;flex-wrap:wrap;gap:20px 30px;margin-top:38px}#choices button{border:0;background:none;padding:10px 0;font-size:18px;display:flex;gap:16px;align-items:center}#choices button:hover{color:var(--pink)}.square{width:17px;height:17px;border:2px solid currentColor;display:inline-block}#choices button:hover .square{background:var(--pink);box-shadow:inset 0 0 0 3px #080808}#pin{display:none;margin-top:32px}.digits{display:flex;gap:15px}.digits input{width:58px;height:65px;border:1px solid #777;border-bottom:3px solid #eee;border-radius:0;background:#111;text-align:center;color:#fff;font-size:28px;caret-color:var(--pink)}#submit{margin-top:24px;background:none;border:1px solid #666;padding:12px 22px;font-size:16px}#submit:hover{border-color:var(--pink);color:var(--pink)}footer{position:fixed;bottom:26px;left:34px;right:34px;display:flex;justify-content:space-between;color:#666;font:12px 'Courier New',monospace;letter-spacing:2px}#progress{display:flex;gap:7px}#progress i{width:6px;height:6px;background:#333}#progress i.active{background:var(--pink)}dialog{background:#0b0b0b;color:#fff;border:2px solid #f4f3ee;padding:32px;width:min(360px,calc(100% - 40px));box-shadow:8px 8px 0 #444}dialog::backdrop{background:#000a}dialog p{font-size:20px;line-height:1.7;margin:0 0 25px}dialog button{background:none;border:0;font-size:16px;color:var(--pink);padding:8px 0}canvas{position:fixed;inset:0;pointer-events:none;z-index:10}#conversation[hidden],#intro[hidden]{display:none}@keyframes float{0%,100%{transform:translateY(-10px)}50%{transform:translateY(10px)}}@keyframes blink{50%{opacity:0}}@media(max-width:550px){header{padding:22px 22px;font-size:10px}.brand{max-width:210px;line-height:1.6}header .date{padding-top:2px}footer{left:22px;right:22px;font-size:10px}#text{line-height:1.9;font-size:21px}#choices{gap:12px 24px}#choices button{font-size:17px}.command{font-size:11px}#intro img{width:210px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><header><span class="brand">invitation to mj's birthday party</span><span class="date">OCT. 06 / 19:00</span></header><main><button id="intro" aria-label="편지 열기"><span class="to">TO. MINJAE</span><img src="envelope.png" alt="핑크 하트 스티커가 붙은 픽셀 편지봉투"><span class="hint">아무 곳이나 눌러 편지를 열어주세요</span></button><section id="conversation" hidden><div class="command"><span>&gt;</span> <span id="label">open invitation.txt</span></div><div id="text" aria-live="polite"></div><div id="choices"></div><form id="pin"><div class="digits"><input aria-label="비밀번호 첫 번째 숫자" inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="off"><input aria-label="비밀번호 두 번째 숫자" inputmode="numeric" pattern="[0-9]" maxlength="1"><input aria-label="비밀번호 세 번째 숫자" inputmode="numeric" pattern="[0-9]" maxlength="1"><input aria-label="비밀번호 네 번째 숫자" inputmode="numeric" pattern="[0-9]" maxlength="1"></div><button id="submit" type="submit">입력 완료 [ENTER]</button></form></section></main><footer><span id="status">ONE NEW LETTER</span><div id="progress" aria-label="초대장 진행 상태"></div><span>WITH LOVE ♡</span></footer><dialog id="warning"><p id="warningText"></p><button id="dismiss">확인 □</button></dialog><canvas id="particles" aria-hidden="true"></canvas><script>
const $=s=>document.querySelector(s), intro=$('#intro'), text=$('#text'), choices=$('#choices'), pin=$('#pin'), warning=$('#warning');
const stages=[{text:'안녕하세요. 민재님이 맞으신가요?',answers:['네','아니오'],correct:0,errors:{1:'거짓말 혼나요.'}},{text:'안녕하세요, 민재님. 질문이 있어요.\n1001... 1002... 1003... 1004... 1005... 100......7...?\n노트북 비밀번호가 무엇이었죠?',pin:true},{text:'정답! 노트북 좀 빌릴게요!^0^\n근데 비밀번호에 무슨 의미가 있나요?',answers:['귀여운 숫자','뽀뽀기념일','민재 생일'],correct:2,errors:{0:'그냥 민재님이 귀여우신 것 같아요.',1:'매일이 뽀뽀기념일입니다.'}},{text:'그렇군요. 어라? 오늘이 바로 1006...\n10월 6일인데요! 오늘 민재님 생일이네요!',answers:['맞아','비밀이야'],correct:0,errors:{1:'다 알고 있어요.'}},{text:'생일 축하해요, 민재님!',after:'\n\n저... 오늘 저녁 7시에 m... j house 303호에서 파티가 있어요! 민재님도 함께 하시겠어요?',answers:['좋아','싫어'],correct:0,errors:{1:'저 울어요...'}},{text:'좋아요! 그럼 7시에 만나요!^3^\n준비물은 행복한 마음, 배고픈 배, 안전운전 이렇게 3가지 되겠습니다!\n그럼, 안녕!'}];
let step=-1, busy=false, version=0;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function type(message,token){for(const char of message){if(token!==version)return false;text.textContent+=char;if(!reduced)await wait(char==='.'?85:char==='\n'?220:45)}return token===version}
function state(){return {step,ready:!busy,screen:step<0?'envelope':'letter'}}
function error(message){$('#warningText').textContent=message;warning.showModal()}
$('#dismiss').onclick=()=>warning.close();warning.addEventListener('click',e=>{if(e.target===warning){const r=warning.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)warning.close()}});
async function render(n){step=n;busy=true;const token=++version;intro.hidden=true;$('#conversation').hidden=false;choices.replaceChildren();pin.style.display='none';text.textContent='';$('#status').textContent='LETTER OPENED';$('#label').textContent=n===5?'see you at 19:00':'read invitation.txt';$('#progress').innerHTML=stages.map((_,i)=>`<i class="${i<=n?'active':''}"></i>`).join('');const s=stages[n];if(!await type(s.text,token))return;if(s.after){burst('color');await wait(1100);if(!await type(s.after,token))return}busy=false;if(s.pin){pin.reset();pin.style.display='block';pin.querySelector('input').focus()}else if(s.answers){s.answers.forEach((a,i)=>{const b=document.createElement('button');b.type='button';b.append(document.createTextNode(a+' '));const sq=document.createElement('span');sq.className='square';sq.setAttribute('aria-hidden','true');b.append(sq);b.onclick=()=>answer(i);choices.append(b)})}else{await wait(2600);if(token!==version)return;busy=true;burst('heart');await wait(2400);reset()}}
function answer(i){if(busy||warning.open||step<0)return {ok:false};const s=stages[step];if(!s.answers||!Number.isInteger(i)||i<0||i>=s.answers.length)return {ok:false};if(i===s.correct){render(step+1);return {ok:true}}error(s.errors[i]);return {ok:false,message:s.errors[i]}}
function reset(){version++;step=-1;busy=false;intro.hidden=false;$('#conversation').hidden=true;$('#status').textContent='ONE NEW LETTER';$('#progress').replaceChildren();intro.focus()}
async function start(){if(step!==-1||busy)return;busy=true;burst('white');await wait(550);render(0)}intro.onclick=start;
const inputs=[...pin.querySelectorAll('input')];inputs.forEach((input,i)=>{input.addEventListener('input',()=>{input.value=input.value.replace(/\D/g,'').slice(-1);if(input.value&&i<3)inputs[i+1].focus()});input.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!input.value&&i>0)inputs[i-1].focus();if(e.key==='ArrowLeft'&&i>0)inputs[i-1].focus();if(e.key==='ArrowRight'&&i<3)inputs[i+1].focus()});input.addEventListener('paste',e=>{const v=e.clipboardData.getData('text').replace(/\D/g,'').slice(0,4);if(!v)return;e.preventDefault();v.split('').forEach((c,j)=>{if(inputs[i+j])inputs[i+j].value=c});inputs[Math.min(3,i+v.length)].focus()})});
function password(value){if(busy||step!==1||warning.open)return {ok:false};if(value==='1006'){render(2);return {ok:true}}error('아닌데...');return {ok:false,message:'아닌데...'}}pin.onsubmit=e=>{e.preventDefault();password(inputs.map(i=>i.value).join(''))};warning.addEventListener('close',()=>{if(step===1){inputs[0].focus();inputs[0].select()}});
const canvas=$('#particles'),ctx=canvas.getContext('2d');let pieces=[],frame;function size(){canvas.width=innerWidth;canvas.height=innerHeight}addEventListener('resize',size);size();const heart=['0110110','1111111','1111111','0111110','0011100','0001000'];
function burst(kind){if(reduced)return;const palette=kind==='color'?['#ff91bb','#fcde68','#8be5e0','#aa9cff','#fff']:kind==='heart'?['#ff91bb','#ff4f94','#ffc1d9']:['#fff'];for(let i=0;i<(kind==='heart'?70:120);i++){const a=Math.random()*Math.PI*2,v=3+Math.random()*9;pieces.push({x:innerWidth/2,y:innerHeight*.48,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,s:kind==='heart'?2+Math.floor(Math.random()*4):3+Math.floor(Math.random()*6),life:1,color:palette[i%palette.length],kind})}if(!frame)animate()}
function animate(){ctx.clearRect(0,0,canvas.width,canvas.height);pieces=pieces.filter(p=>p.life>0);for(const p of pieces){p.x+=p.vx;p.y+=p.vy;p.vy+=.075;p.life-=.007;ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillStyle=p.color;if(p.kind==='heart')heart.forEach((row,y)=>[...row].forEach((v,x)=>{if(v==='1')ctx.fillRect(Math.round(p.x+x*p.s),Math.round(p.y+y*p.s),p.s,p.s)}));else{ctx.fillRect(Math.round(p.x),Math.round(p.y),p.s,p.s);if(p.kind==='white'&&p.s>6){ctx.fillRect(p.x-p.s,p.y+p.s/3,p.s*3,p.s/3);ctx.fillRect(p.x+p.s/3,p.y-p.s,p.s/3,p.s*3)}}}ctx.globalAlpha=1;frame=pieces.length?requestAnimationFrame(animate):null}
if(document.modelContext?.registerTool){for(const tool of [{name:'read_invitation_state',description:'Read the current invitation screen and readiness.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:()=>state()},{name:'open_invitation',description:'Open the birthday letter.',inputSchema:{type:'object',properties:{},additionalProperties:false},execute:async()=>{await start();return state()}},{name:'answer_invitation',description:'Answer the current question using its zero-based choice index or four-digit password. Incorrect answers do not advance.',inputSchema:{type:'object',properties:{choice:{type:'integer'},password:{type:'string'}},additionalProperties:false},execute:input=>{if(!input||typeof input!=='object')throw Error('Invalid input');return typeof input.password==='string'?password(input.password):answer(input.choice)}}]){try{Promise.resolve(document.modelContext.registerTool(tool)).catch(()=>{})}catch{}}}
</script></body></html>
